<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四季更迭动态效果图</title>
  <style>
    :root {
      --paper: #fcfbf8;
      --ink: #202020;
      --muted: #6d6a66;
      --line: #ddd9d4;
      --blue: #5c9bf6;
      --pink: #ffe3dd;
      --yellow: #fff7b8;
      --card: rgba(255,255,255,.78);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f0eb;
      color: var(--ink);
      font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; }
    .page {
      width: min(1180px, calc(100vw - 28px));
      margin: 22px auto;
      padding: clamp(22px, 4vw, 46px);
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 18px 40px rgba(32,32,32,.08);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .brand { letter-spacing: .08em; text-transform: uppercase; }
    .back { text-decoration: none; border-bottom: 1px solid var(--blue); }
    header { padding: 34px 0 28px; }
    .eyebrow {
      width: fit-content;
      padding: 5px 12px;
      background: var(--yellow);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    h1 {
      margin: 18px 0 12px;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(34px, 7vw, 72px);
      line-height: .98;
      letter-spacing: -.04em;
    }
    .subtitle {
      max-width: 780px;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 20px);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }
    .media {
      aspect-ratio: 16 / 10;
      background: #ebe7df;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    img, video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #f7f3ed;
    }
    .caption {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 4px;
      font-size: 17px;
      line-height: 1.25;
    }
    p { margin: 0; }
    .caption p, .note { color: var(--muted); font-size: 13px; }
    .index-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }
    .index-card {
      min-height: 168px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s ease, border-color .2s ease;
    }
    .index-card:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
    }
    .count {
      width: fit-content;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--pink);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }
    footer {
      margin-top: 34px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

  </main>
</body>
</html>
